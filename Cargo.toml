[package]
name = "tapswarm"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "汎用混雑度測定サービス — 認証不要のスライディングウィンドウ型チェックイン集計API"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    # `migrate` は sqlx-core 側の機能を有効にするだけで、`sqlx::migrate!` マクロ
    # 自体は `macros` が必要（sqlx 側の定義が `sqlx-macros?/migrate` と
    # オプショナル依存になっているため）。
    # なお query! 系のコンパイル時検証マクロは使っていないので、
    # ビルド時に DATABASE_URL は不要。
    "macros",
    "migrate",
] }

hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
data-encoding = "2"
rand = "0.8"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
